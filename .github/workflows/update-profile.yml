name: Update profile

# Refreshes the contribution graph. Runs daily, on every push to main,
# and on demand.

on:
  schedule:
    - cron: "23 5 * * *"   # ~07:23 Göteborg time
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "assets/heatmap.svg"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/heatmap.svg"
